services:
  db:
    image: postgres:16-alpine
    container_name: dingeriq-db
    environment:
      POSTGRES_USER: dingeriq
      POSTGRES_PASSWORD: dingeriq
      POSTGRES_DB: dingeriq
    ports:
      - "5432:5432"
    volumes:
      - dingeriq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingeriq"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: dingeriq-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dingeriq_pg:
