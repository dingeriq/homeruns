# Cloudflare/Fly.io deployment for the DingerIQ FastAPI backend.
# Usage:
#   fly launch --no-deploy --copy-config --name dingeriq-api
#   fly postgres create --name dingeriq-db && fly postgres attach dingeriq-db
#   fly deploy
app = "dingeriq-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "DingerIQ API"
  ENVIRONMENT = "production"
  PORT = "8000"
  LOG_LEVEL = "INFO"
  # Comma-separated list of allowed browser origins.
  CORS_ORIGINS = "https://homeruns.lovable.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
