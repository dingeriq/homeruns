# Render.com blueprint for the DingerIQ FastAPI backend.
# Usage: push this repo to GitHub, then Render > New > Blueprint > select repo.
services:
  - type: web
    name: dingeriq-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: APP_NAME
        value: DingerIQ API
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://homeruns.lovable.app
      - key: DATABASE_URL
        fromDatabase:
          name: dingeriq-db
          property: connectionString

databases:
  - name: dingeriq-db
    plan: basic-256mb
    databaseName: dingeriq
    user: dingeriq
